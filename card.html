<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <title id="pageTitle">Ilyas Digital Card</title>
    <meta id="metaDescription" name="description" content="Ilyas Mboula Moro — Business System Analyst, Builder. Scan or tap to connect.">

    <meta property="og:title" content="Ilyas Mboula Moro — Digital Card">
    <meta property="og:description" content="Business System Analyst • Builder">
    <meta property="og:image" content="https://ilyas-digital-card.netlify.app/profile.jpg">
    <meta property="og:url" content="https://ilyas-digital-card.netlify.app/card.html">
    <meta property="og:type" content="profile">
    <meta name="twitter:card" content="summary">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, #16233d 0%, #0b1120 55%, #05070d 100%);
            color: #f1f5f9;
            text-align: center;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 460px;
            height: 460px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.28;
            z-index: 0;
            pointer-events: none;
            animation: drift 12s ease-in-out infinite alternate;
        }

        body::before {
            background: #2563eb;
            top: -160px;
            left: -160px;
        }

        body::after {
            background: #0ea5e9;
            bottom: -160px;
            right: -160px;
            animation-delay: 2s;
        }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(20px, 30px) scale(1.08); }
        }

        .card-wrap {
            position: relative;
            z-index: 1;
            max-width: 400px;
            margin: 60px auto;
            perspective: 900px;
        }

        .glow-ring {
            position: absolute;
            inset: -3px;
            border-radius: 29px;
            background: conic-gradient(from 0deg, #0b1120, #1e3a8a, #2563eb, #38bdf8, #1e3a8a, #0b1120);
            filter: blur(11px);
            opacity: 0.6;
            z-index: 0;
            animation: spin 7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .card {
            position: relative;
            z-index: 1;
            padding: 36px 28px 30px;
            background: linear-gradient(165deg, rgba(30, 58, 138, 0.16), rgba(2, 6, 23, 0.55));
            backdrop-filter: blur(26px) saturate(170%);
            -webkit-backdrop-filter: blur(26px) saturate(170%);
            border: 1px solid rgba(96, 165, 250, 0.16);
            border-radius: 26px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(147, 197, 253, 0.1);
            transition: transform .2s ease-out;
            will-change: transform;
        }

        .sheen {
            position: absolute;
            inset: 0;
            z-index: 5;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.32) 45%, rgba(147,197,253,0.32) 50%, rgba(255,255,255,0.32) 55%, transparent 70%);
            background-size: 250% 250%;
            background-position: 50% 50%;
            opacity: 0;
            transition: opacity .3s ease;
            mix-blend-mode: overlay;
        }

        .card.tilting .sheen {
            opacity: 1;
        }

        .card > *:not(.sheen) {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(.2, .7, .3, 1) forwards;
        }

        .card > *:nth-child(2) { animation-delay: .05s; }
        .card > *:nth-child(3) { animation-delay: .10s; }
        .card > *:nth-child(4) { animation-delay: .16s; }
        .card > *:nth-child(5) { animation-delay: .22s; }
        .card > *:nth-child(6) { animation-delay: .28s; }
        .card > *:nth-child(7) { animation-delay: .34s; }
        .card > *:nth-child(8) { animation-delay: .40s; }
        .card > *:nth-child(9) { animation-delay: .46s; }
        .card > *:nth-child(10) { animation-delay: .52s; }
        .card > *:nth-child(11) { animation-delay: .58s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        img.avatar, .avatar.initials {
            width: 122px;
            height: 122px;
            border-radius: 50%;
            border: 3px solid rgba(59, 130, 246, 0.65);
            box-shadow:
                0 0 0 6px rgba(59, 130, 246, 0.10),
                0 10px 26px rgba(0, 0, 0, 0.45);
            object-fit: cover;
        }

        .avatar.initials {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            background: linear-gradient(135deg, #1e3a8a, #38bdf8);
            font-size: 2.4rem;
            font-weight: 700;
            color: white;
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 18px 0 4px;
        }

        .role {
            font-size: 0.95rem;
            font-weight: 500;
            color: #94a3b8;
            margin: 0;
        }

        .pitch {
            display: inline-block;
            font-size: 13px;
            line-height: 1.5;
            color: #bfdbfe;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.32);
            border-radius: 999px;
            padding: 9px 18px;
            margin: 16px 0 22px;
        }

        .pitch:empty {
            display: none;
        }

        a.btn, button.btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin: 10px 0;
            padding: 10px 16px 10px 10px;
            background: rgba(2, 6, 23, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(96, 165, 250, 0.14);
            border-radius: 14px;
            color: #f1f5f9;
            text-decoration: none;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, background .25s ease, border-color .25s ease;
        }

        a.btn:hover, button.btn:hover {
            transform: translateY(-2px);
            background: rgba(30, 58, 138, 0.28);
            border-color: rgba(96, 165, 250, 0.4);
            box-shadow: 0 14px 30px rgba(2, 6, 23, 0.55);
        }

        a.btn:active, button.btn:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(2, 6, 23, 0.45);
        }

        a.btn:focus-visible, button.btn:focus-visible {
            outline: 2px solid rgba(59, 130, 246, 0.8);
            outline-offset: 2px;
        }

        a.btn.hidden {
            display: none;
        }

        .icon-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(14, 165, 233, 0.12));
            border: 1px solid rgba(96, 165, 250, 0.25);
            color: #93c5fd;
        }

        .icon-badge svg {
            width: 18px;
            height: 18px;
        }

        .btn-label {
            flex: 1;
        }

        .chevron {
            color: #475569;
            font-size: 18px;
            line-height: 1;
        }

        button.save .icon-badge {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.32), rgba(14, 165, 233, 0.14));
            border-color: rgba(56, 189, 248, 0.4);
            color: #7dd3fc;
        }

        button.save {
            background: rgba(14, 165, 233, 0.12);
            border-color: rgba(56, 189, 248, 0.35);
            color: #bae6fd;
        }

        button.save:hover {
            background: rgba(14, 165, 233, 0.2);
            border-color: rgba(56, 189, 248, 0.55);
            box-shadow: 0 14px 30px rgba(14, 165, 233, 0.22);
        }

        .made-with {
            display: block;
            margin-top: 18px;
            font-size: 11px;
            color: #64748b;
            text-decoration: none;
        }

        .made-with:hover {
            color: #94a3b8;
        }

        .confetti-piece {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 50;
            animation: confetti-burst .9s cubic-bezier(.2,.8,.2,1) forwards;
        }

        @keyframes confetti-burst {
            to {
                transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card > *, body::before, body::after, .glow-ring {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .card { transition: none !important; }
            .sheen { display: none !important; }
        }
    </style>
</head>

<body>

    <div class="card-wrap" id="cardWrap">
        <div class="glow-ring"></div>
        <div class="card" id="card">
            <div class="sheen"></div>

            <img class="avatar" id="avatarImg" src="profile.jpg" alt="Ilyas Mboula Moro">
            <div class="avatar initials" id="avatarInitials" style="display:none;"></div>

            <h1 id="nameEl">Ilyas Mboula Moro</h1>
            <p class="role" id="roleEl">Business System Analyst • Builder</p>

            <div class="pitch" id="pitchEl">Open to AI internships and collaborating on ML projects</div>

            <a class="btn" id="waBtn" href="https://wa.me/27721234567" target="_blank">
                <span class="icon-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </span>
                <span class="btn-label">WhatsApp</span>
                <span class="chevron">›</span>
            </a>
            <a class="btn" id="emailBtn" href="mailto:mboulamoroilyas@gmail.com">
                <span class="icon-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
                </span>
                <span class="btn-label">Email</span>
                <span class="chevron">›</span>
            </a>
            <a class="btn" id="linkedinBtn" href="https://www.linkedin.com/in/ilyas-m-moro-0508a62b1" target="_blank">
                <span class="icon-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                </span>
                <span class="btn-label">LinkedIn</span>
                <span class="chevron">›</span>
            </a>
            <button class="btn save" id="saveBtn" onclick="saveContact(event)">
                <span class="icon-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h3M15 12h3M7 16h10"/></svg>
                </span>
                <span class="btn-label">Save Contact</span>
            </button>

            <a class="made-with" href="create.html">Made with this card generator — create your own</a>
        </div>
    </div>

    <script>
        const profile = {
            name: 'Ilyas Mboula Moro',
            role: 'Business System Analyst • Builder',
            pitch: 'Open to AI internships and collaborating on ML projects',
            wa: '27721234567',
            email: 'mboulamoroilyas@gmail.com',
            linkedin: 'https://www.linkedin.com/in/ilyas-m-moro-0508a62b1',
            photo: ''
        };

        const params = new URLSearchParams(window.location.search);
        const hasAnyParam = [...params.keys()].length > 0;

        ['name', 'role', 'pitch', 'wa', 'email', 'linkedin', 'photo'].forEach((key) => {
            const value = params.get(key);
            if (value) profile[key] = value;
        });

        function applyProfile() {
            document.getElementById('pageTitle').textContent = profile.name + ' — Digital Card';
            document.getElementById('metaDescription').setAttribute('content', profile.name + ' — ' + profile.role);

            document.getElementById('nameEl').textContent = profile.name;
            document.getElementById('roleEl').textContent = profile.role;
            document.getElementById('pitchEl').textContent = profile.pitch;

            const avatarImg = document.getElementById('avatarImg');
            const avatarInitials = document.getElementById('avatarInitials');

            if (profile.photo) {
                avatarImg.src = profile.photo;
                avatarImg.alt = profile.name;
                avatarImg.style.display = '';
                avatarInitials.style.display = 'none';
            } else if (hasAnyParam) {
                avatarImg.style.display = 'none';
                avatarInitials.style.display = 'flex';
                avatarInitials.textContent = profile.name
                    .split(/\s+/)
                    .filter(Boolean)
                    .slice(0, 2)
                    .map((w) => w[0].toUpperCase())
                    .join('');
            }

            const waBtn = document.getElementById('waBtn');
            const emailBtn = document.getElementById('emailBtn');
            const linkedinBtn = document.getElementById('linkedinBtn');

            if (profile.wa) {
                waBtn.href = 'https://wa.me/' + profile.wa.replace(/[^\d]/g, '');
            } else {
                waBtn.classList.add('hidden');
            }

            if (profile.email) {
                emailBtn.href = 'mailto:' + profile.email;
            } else {
                emailBtn.classList.add('hidden');
            }

            if (profile.linkedin) {
                linkedinBtn.href = profile.linkedin;
            } else {
                linkedinBtn.classList.add('hidden');
            }
        }

        function vcardEscape(str) {
            return String(str).replace(/([,;\\])/g, '\\$1');
        }

        function saveContact(evt) {
            const nameParts = profile.name.trim().split(/\s+/);
            const lastName = nameParts.length > 1 ? nameParts.pop() : '';
            const firstName = nameParts.join(' ');

            const lines = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `N:${vcardEscape(lastName)};${vcardEscape(firstName)};;;`,
                `FN:${vcardEscape(profile.name)}`,
                `TITLE:${vcardEscape(profile.role)}`
            ];

            if (profile.email) lines.push(`EMAIL:${vcardEscape(profile.email)}`);
            if (profile.wa) lines.push(`TEL;TYPE=CELL:+${profile.wa.replace(/[^\d]/g, '')}`);
            if (profile.linkedin) lines.push(`URL;TYPE=LinkedIn:${vcardEscape(profile.linkedin)}`);
            if (profile.wa) lines.push(`URL;TYPE=WhatsApp:https://wa.me/${profile.wa.replace(/[^\d]/g, '')}`);

            lines.push('END:VCARD');

            const blob = new Blob([lines.join('\n')], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = profile.name.replace(/\s+/g, '_') + '.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            if (evt && evt.currentTarget) {
                launchConfetti(evt.currentTarget);
            }
        }

        function launchConfetti(originEl) {
            const rect = originEl.getBoundingClientRect();
            const originX = rect.left + rect.width / 2;
            const originY = rect.top + rect.height / 2;
            const colors = ['#3b82f6', '#38bdf8', '#60a5fa', '#0ea5e9', '#f1f5f9'];

            for (let i = 0; i < 26; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                el.style.left = originX + 'px';
                el.style.top = originY + 'px';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];

                const angle = Math.random() * Math.PI * 2;
                const distance = 70 + Math.random() * 130;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance - 50;
                const rot = (Math.random() * 720 - 360) + 'deg';

                el.style.setProperty('--dx', dx + 'px');
                el.style.setProperty('--dy', dy + 'px');
                el.style.setProperty('--rot', rot);

                document.body.appendChild(el);
                el.addEventListener('animationend', () => el.remove());
            }
        }

        (function initTilt() {
            const wrap = document.getElementById('cardWrap');
            const card = document.getElementById('card');
            const maxTilt = 9;
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReducedMotion) return;

            function applyTilt(px, py) {
                const rotateY = px * maxTilt * 2;
                const rotateX = -py * maxTilt * 2;
                card.style.transform = `perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                card.classList.add('tilting');
                const sheen = card.querySelector('.sheen');
                sheen.style.backgroundPosition = `${50 + px * 60}% ${50 + py * 60}%`;
            }

            function resetTilt() {
                card.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg)';
                card.classList.remove('tilting');
            }

            function fromPoint(clientX, clientY) {
                const rect = card.getBoundingClientRect();
                const px = (clientX - rect.left) / rect.width - 0.5;
                const py = (clientY - rect.top) / rect.height - 0.5;
                applyTilt(px, py);
            }

            wrap.addEventListener('mousemove', (e) => fromPoint(e.clientX, e.clientY));
            wrap.addEventListener('mouseleave', resetTilt);
        })();

        applyProfile();
    </script>

</body>
</html>
