<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilyas Digital Card</title>
    <meta name="description" content="Ilyas Mboula Moro — Business System Analyst, Builder. Scan or tap to connect.">

    <meta property="og:title" content="Ilyas Mboula Moro — Digital Card">
    <meta property="og:description" content="Business System Analyst • Builder">
    <meta property="og:image" content="https://ilyasmoro.github.io/QR_Contact_Codes_001/profile.jpg">
    <meta property="og:url" content="https://ilyasmoro.github.io/QR_Contact_Codes_001/">
    <meta property="og:type" content="profile">
    <meta name="twitter:card" content="summary">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
        }

        .card {
            max-width: 400px;
            margin: 60px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
        }

        img.avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            object-fit: cover;
        }

        .pitch {
            font-size: 14px;
            color: #cbd5e1;
            background: #0f172a;
            border-radius: 8px;
            padding: 10px 14px;
            margin: 14px 0 20px;
        }

        a, button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
            padding: 12px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
        }

        a:hover, button:hover {
            background: #2563eb;
        }

        button.save {
            background: #22c55e;
        }

        button.save:hover {
            background: #16a34a;
        }

        .qr-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }

        .qr-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr {
            padding: 10px;
            background: white;
            border-radius: 10px;
        }

        .qr img {
            display: block;
            width: 130px;
            height: 130px;
        }

        .qr-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
            max-width: 130px;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- your photo -->
        <img class="avatar" src="profile.jpg" alt="Ilyas Mboula Moro">

        <h1>Ilyas Mboula Moro</h1>
        <p>Business System Analyst • Builder</p>

        <div class="pitch">Open to AI internships and collaborating on ML projects</div>

        <a href="https://wa.me/27721234567" target="_blank">💬 WhatsApp</a>
        <a href="mailto:mboulamoroilyas@gmail.com">✉️ Email</a>
        <a href="https://www.linkedin.com/in/ilyas-m-moro-0508a62b1" target="_blank">🔗 LinkedIn</a>
        <button class="save" onclick="saveContact()">📇 Save Contact</button>

        <div class="qr-row">
            <div class="qr-block">
                <div class="qr">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=BEGIN%3AVCARD%0D%0AVERSION%3A3.0%0D%0AN%3AMoro%3BIlyas%3B%3B%3B%0D%0AFN%3AIlyas%20Mboula%20Moro%0D%0ATITLE%3ABusiness%20System%20Analyst%0D%0AEMAIL%3Amboulamoroilyas%40gmail.com%0D%0ATEL%3BTYPE%3DCELL%3A%2B27721234567%0D%0AURL%3Ahttps%3A%2F%2Fwww.linkedin.com%2Fin%2Filyas-m-moro-0508a62b1%0D%0AEND%3AVCARD" alt="QR code that saves this contact directly">
                </div>
                <div class="qr-label">Scan to save contact instantly</div>
            </div>
            <div class="qr-block">
                <div class="qr">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=https%3A%2F%2Filyasmoro.github.io%2FQR_Contact_Codes_001%2F" alt="QR code linking to this card">
                </div>
                <div class="qr-label">Scan to view this card</div>
            </div>
        </div>

    </div>

    <script>
        function saveContact() {
            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:Moro;Ilyas;;;',
                'FN:Ilyas Mboula Moro',
                'TITLE:Business System Analyst',
                'EMAIL:mboulamoroilyas@gmail.com',
                'TEL;TYPE=CELL:+27721234567',
                'URL:https://www.linkedin.com/in/ilyas-m-moro-0508a62b1',
                'END:VCARD'
            ].join('\n');

            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Ilyas_Mboula_Moro.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>

</body>
</html>
