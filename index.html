<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <title>Ilyas Digital Card</title>
    <meta name="description" content="Scan to connect with Ilyas Mboula Moro.">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, #16233d 0%, #0b1120 55%, #05070d 100%);
            color: #f1f5f9;
            text-align: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 460px;
            height: 460px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.28;
            z-index: 0;
            pointer-events: none;
            animation: drift 12s ease-in-out infinite alternate;
        }

        body::before {
            background: #2563eb;
            top: -160px;
            left: -160px;
        }

        body::after {
            background: #0ea5e9;
            bottom: -160px;
            right: -160px;
            animation-delay: 2s;
        }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(20px, 30px) scale(1.08); }
        }

        .frame-wrap {
            position: relative;
            z-index: 1;
            perspective: 900px;
        }

        .glow-ring {
            position: absolute;
            inset: -3px;
            border-radius: 26px;
            background: conic-gradient(from 0deg, #0b1120, #1e3a8a, #2563eb, #38bdf8, #1e3a8a, #0b1120);
            filter: blur(11px);
            opacity: 0.6;
            z-index: 0;
            animation: spin 7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .frame {
            position: relative;
            z-index: 1;
            padding: 34px 34px 26px;
            background: linear-gradient(165deg, rgba(30, 58, 138, 0.16), rgba(2, 6, 23, 0.55));
            backdrop-filter: blur(26px) saturate(170%);
            -webkit-backdrop-filter: blur(26px) saturate(170%);
            border: 1px solid rgba(96, 165, 250, 0.16);
            border-radius: 24px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(147, 197, 253, 0.1);
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(.2, .7, .3, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .qr {
            padding: 12px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        }

        .qr img {
            display: block;
            width: 200px;
            height: 200px;
        }

        .label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.02em;
        }

        .label svg {
            width: 15px;
            height: 15px;
            color: #60a5fa;
        }

        @media (prefers-reduced-motion: reduce) {
            .frame, .glow-ring, body::before, body::after {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="frame-wrap">
        <div class="glow-ring"></div>
        <div class="frame">
            <div class="qr">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Filyas-digital-card.netlify.app%2Fcard.html" alt="QR code to Ilyas's digital contact card">
            </div>
            <div class="label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
                <span>Scan to connect</span>
            </div>
        </div>
    </div>

</body>
</html>
