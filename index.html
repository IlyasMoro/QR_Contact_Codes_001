<!DOCTYPE html>
<html>
<head>
    <title>Ilyas Digital Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
        }

        .card {
            max-width: 400px;
            margin: 80px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #3b82f6;
            object-fit: cover;
        }

        a {
            display: block;
            margin: 10px 0;
            padding: 12px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- your photo -->
        <img src="profile.jpg">

        <h1>Ilyas Mboula Moro</h1>
        <p>AI Developer • Entrepreneur • Builder</p>

        <a href="https://wa.me/27721234567" target="_blank">💬 WhatsApp</a>
        <a href="https://www.linkedin.com/in/your-profile" target="_blank">🔗 LinkedIn</a>

    </div>

</body>
</html>
